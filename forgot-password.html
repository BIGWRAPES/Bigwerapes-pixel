<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Nexa</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .forgot-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #070708 0%, #1f1f23 100%);
        }

        .forgot-card {
            background: var(--surface-color);
            border: 1px solid rgba(0, 136, 112, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 10px;
        }

        .forgot-header p {
            color: var(--default-color);
            font-size: 14px;
            margin: 0;
        }

        .form-label {
            display: block;
            color: var(--heading-color);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 136, 112, 0.3);
            color: var(--heading-color);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-color);
            color: var(--heading-color);
            box-shadow: 0 0 0 3px rgba(0, 136, 112, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            background: color-mix(in srgb, var(--accent-color), transparent 15%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 136, 112, 0.3);
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: color-mix(in srgb, var(--accent-color), transparent 25%);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid;
            display: none;
        }

        .alert-error {
            background: rgba(223, 21, 41, 0.1);
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 136, 112, 0.1);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-card">
            <div class="forgot-header">
                <h1>Forgot Password?</h1>
                <p>Enter your email to reset your password</p>
            </div>

            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>

                <div class="back-link">
                    <a href="log%20in%20form/form.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>
    <script>
        const forgotForm = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                errorAlert.textContent = 'Please enter your email address';
                errorAlert.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                // TODO: Implement password reset API
                successAlert.textContent = 'Instructions sent to your email!';
                successAlert.style.display = 'block';
                errorAlert.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = 'log%20in%20form/form.html';
                }, 2000);
            } catch (error) {
                errorAlert.textContent = 'An error occurred. Please try again.';
                errorAlert.style.display = 'block';
                successAlert.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
