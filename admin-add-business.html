    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load available users
        async function loadUsers() {
            try {
                // For now, create a default ADMIN user if it doesn't exist
                const response = await fetch('/nexa/api/get_or_create_admin.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'get_or_create_admin'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const userSelect = document.getElementById('userId');
                    const option = document.createElement('option');
                    option.value = data.user_id;
                    option.textContent = data.user_name || 'Admin User';
                    option.selected = true;
                    userSelect.appendChild(option);
                    
                    // Set owner name to Admin if not already set
                    if (!document.getElementById('ownerName').value) {
                        document.getElementById('ownerName').value = data.user_name || 'Administrator';
                    }
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }
        
        // Form submission
        document.getElementById('businessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show loading state
            const submitBtn = document.querySelector('.btn-submit');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitText = document.getElementById('submitText');
            
            submitBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            submitText.textContent = 'Creating...';
            
            // Hide error message
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').classList.remove('show');
            
            // Collect form data
            const formData = new FormData(document.getElementById('businessForm'));
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/nexa/api/add_business.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Show success message
                    const successMsg = document.getElementById('successMessage');
                    const successDetails = document.getElementById('successDetails');
                    successDetails.innerHTML = `
                        Business ID: <strong>${result.business_id}</strong><br>
                        Slug: <strong>${result.business_slug}</strong>
                    `;
                    successMsg.classList.add('show');
                    
                    // Reset form
                    document.getElementById('businessForm').reset();
                    
                    // Scroll to top
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Show error message
                    const errorMsg = document.getElementById('errorMessage');
                    const errorText = document.getElementById('errorText');
                    errorText.textContent = result.message || result.error || 'Failed to create business';
                    errorMsg.style.display = 'block';
                    errorMsg.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                // Show error message
                const errorMsg = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                errorText.textContent = error.message || 'An error occurred while creating the business';
                errorMsg.style.display = 'block';
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                submitText.textContent = 'Create Business Profile';
            }
        });
        
        // Load users on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });
    </script>
